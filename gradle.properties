# Conservative memory profile for on-device builds (phones, Termux) —
# mirrors the tuning Valence itself uses (VALENCE-DEVDOC §6: low Xmx,
# kotlin in-process, single worker, no daemon).
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process

# nhzterm is pure Android-framework Kotlin: zero AndroidX dependencies,
# by design, so on-device builds download nothing beyond AGP + Kotlin.
android.useAndroidX=false
android.nonTransitiveRClass=true
android.enableJetifier=true
