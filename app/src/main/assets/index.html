<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Source Viewer</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#161923;
    --border:#262b3a;
    --text:#e6e8ee;
    --muted:#8b91a5;
    --accent:#6c8cff;
    --accent2:#ff6c9c;
    --code-bg:#0b0d12;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:linear-gradient(160deg,#0f1115,#141824);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:32px 24px 16px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:28px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:.5px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .bar{
    max-width:900px;
    margin:20px auto;
    display:flex;
    gap:10px;
    padding:0 20px;
  }
  input[type="text"]{
    flex:1;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .15s;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  button{
    padding:14px 22px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#0b0d12;
    font-weight:600;
    cursor:pointer;
    font-size:15px;
    transition:transform .1s, opacity .15s;
  }
  button:hover{opacity:.9;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .status{
    max-width:900px;
    margin:0 auto;
    padding:0 20px;
    color:var(--muted);
    font-size:13px;
    min-height:20px;
  }
  .status.error{color:var(--accent2);}
  .container{
    max-width:1100px;
    margin:20px auto 60px;
    padding:0 20px;
  }
  .tabs{
    display:flex;
    gap:6px;
    border-bottom:1px solid var(--border);
    margin-bottom:0;
    flex-wrap:wrap;
  }
  .tab{
    padding:10px 18px;
    cursor:pointer;
    color:var(--muted);
    border-bottom:2px solid transparent;
    font-size:14px;
    user-select:none;
  }
  .tab.active{
    color:var(--text);
    border-bottom-color:var(--accent);
  }
  .tab-count{
    font-size:11px;
    color:var(--muted);
    margin-left:4px;
  }
  .panel{
    display:none;
    background:var(--code-bg);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 10px 10px;
    max-height:65vh;
    overflow:auto;
  }
  .panel.active{display:block;}
  .panel-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    position:sticky;
    top:0;
  }
  .panel-toolbar span{font-size:12px;color:var(--muted);}
  .copy-btn{
    padding:6px 12px;
    font-size:12px;
    background:var(--border);
    color:var(--text);
    border-radius:6px;
  }
  pre{
    margin:0;
    padding:16px;
    font-family:'Cascadia Code','Fira Code',Consolas,monospace;
    font-size:13px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .asset-list{
    padding:12px 16px;
  }
  .asset-item{
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .asset-item a{color:var(--accent);text-decoration:none;}
  .asset-item a:hover{text-decoration:underline;}
  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{
    max-width:900px;
    margin:8px auto 0;
    padding:0 20px;
    font-size:12px;
    color:var(--muted);
  }
  .hint code{
    background:var(--panel);
    padding:1px 6px;
    border-radius:4px;
    border:1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>&lt;/&gt; Source Viewer</h1>
  <p>Paste a link. Get the HTML, linked CSS, and linked JS.</p>
</header>

<div class="bar">
  <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
  <button id="fetchBtn">View Source</button>
</div>
<div class="status" id="status"></div>
<div class="hint">Tip: works best on public pages. Some sites block cross-origin fetching entirely — if it fails, try <code>view-source:</code> + the URL directly in your browser's address bar.</div>

<div class="container">
  <div class="tabs" id="tabs" style="display:none;">
    <div class="tab active" data-tab="html">HTML</div>
    <div class="tab" data-tab="css">CSS <span class="tab-count" id="cssCount"></span></div>
    <div class="tab" data-tab="js">JS <span class="tab-count" id="jsCount"></span></div>
  </div>

  <div class="panel active" id="panel-html">
    <div class="empty">Enter a URL above to get started.</div>
  </div>
  <div class="panel" id="panel-css"></div>
  <div class="panel" id="panel-js"></div>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const fetchBtn = document.getElementById('fetchBtn');
const statusEl = document.getElementById('status');
const tabs = document.getElementById('tabs');
const panels = {
  html: document.getElementById('panel-html'),
  css: document.getElementById('panel-css'),
  js: document.getElementById('panel-js'),
};

// Rotate through a couple of public CORS proxies for resilience.
const PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
];

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    Object.values(panels).forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    panels[tab.dataset.tab].classList.add('active');
  });
});

function normalizeUrl(raw) {
  let u = raw.trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { new URL(u); return u; } catch { return null; }
}

async function fetchViaProxies(url) {
  let lastErr;
  for (const buildProxyUrl of PROXIES) {
    try {
      const res = await fetch(buildProxyUrl(url));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text) return text;
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error('All proxies failed');
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderCodeBlock(panel, label, code) {
  panel.innerHTML = `
    <div class="panel-toolbar">
      <span>${label}</span>
      <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.panel').querySelector('pre').textContent)">Copy</button>
    </div>
    <pre>${escapeHtml(code)}</pre>
  `;
}

function renderAssetList(panel, label, items, baseUrl) {
  if (!items.length) {
    panel.innerHTML = `<div class="empty">No ${label.toLowerCase()} found.</div>`;
    return;
  }
  const rows = items.map(src => {
    let resolved = src;
    try { resolved = new URL(src, baseUrl).href; } catch {}
    return `<div class="asset-item"><a href="${resolved}" target="_blank" rel="noopener">${escapeHtml(resolved)}</a></div>`;
  }).join('');
  panel.innerHTML = `<div class="panel-toolbar"><span>${items.length} linked file(s) — click to open</span></div><div class="asset-list">${rows}</div>`;
}

async function handleFetch() {
  const url = normalizeUrl(urlInput.value);
  if (!url) {
    statusEl.textContent = 'Enter a valid URL, like https://example.com';
    statusEl.className = 'status error';
    return;
  }

  fetchBtn.disabled = true;
  statusEl.className = 'status';
  statusEl.innerHTML = '<span class="spinner"></span> Fetching source…';
  tabs.style.display = 'none';

  try {
    const html = await fetchViaProxies(url);

    // Inline <style> blocks
    const inlineStyleMatches = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)]
      .map(m => m[1]).join('\n\n/* --- */\n\n');

    // Linked <link rel="stylesheet">
    const cssLinks = [...html.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]*href=["']([^"']+)["']/gi)]
      .map(m => m[1]);
    // handle href-before-rel ordering too
    const cssLinks2 = [...html.matchAll(/<link[^>]+href=["']([^"']+)["'][^>]*rel=["']stylesheet["']/gi)]
      .map(m => m[1]);
    const allCssLinks = [...new Set([...cssLinks, ...cssLinks2])];

    // Inline <script> blocks (no src)
    const inlineScriptMatches = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)]
      .map(m => m[1]).filter(s => s.trim()).join('\n\n// --- \n\n');

    // Linked <script src="...">
    const jsLinks = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
      .map(m => m[1]);

    // HTML tab
    renderCodeBlock(panels.html, `${url} — full HTML source`, html);

    // CSS tab
    let cssContent = '';
    if (inlineStyleMatches) cssContent += `/* Inline <style> blocks */\n\n${inlineStyleMatches}\n\n`;
    if (allCssLinks.length) {
      cssContent += `/* Linked stylesheets (${allCssLinks.length}) — see file list below, opening in HTML view since these need separate fetch */`;
      renderCodeBlock(panels.css, 'Inline CSS + linked file list', cssContent);
      const listHtml = allCssLinks.map(src => {
        let resolved = src;
        try { resolved = new URL(src, url).href; } catch {}
        return `<div class="asset-item"><a href="${resolved}" target="_blank" rel="noopener">${escapeHtml(resolved)}</a></div>`;
      }).join('');
      panels.css.innerHTML += `<div class="asset-list"><div class="panel-toolbar"><span>Linked stylesheets</span></div>${listHtml}</div>`;
    } else {
      renderCodeBlock(panels.css, 'Inline CSS', cssContent || '/* No CSS found */');
    }
    document.getElementById('cssCount').textContent = `(${allCssLinks.length + (inlineStyleMatches ? 1 : 0)})`;

    // JS tab
    let jsContent = '';
    if (inlineScriptMatches) jsContent += `// Inline <script> blocks\n\n${inlineScriptMatches}\n\n`;
    renderCodeBlock(panels.js, 'Inline JS + linked file list', jsContent || '// No inline scripts found');
    if (jsLinks.length) {
      const listHtml = jsLinks.map(src => {
        let resolved = src;
        try { resolved = new URL(src, url).href; } catch {}
        return `<div class="asset-item"><a href="${resolved}" target="_blank" rel="noopener">${escapeHtml(resolved)}</a></div>`;
      }).join('');
      panels.js.innerHTML += `<div class="asset-list"><div class="panel-toolbar"><span>Linked scripts</span></div>${listHtml}</div>`;
    }
    document.getElementById('jsCount').textContent = `(${jsLinks.length + (inlineScriptMatches ? 1 : 0)})`;

    tabs.style.display = 'flex';
    statusEl.textContent = `Loaded ${html.length.toLocaleString()} characters of HTML from ${url}`;
    statusEl.className = 'status';

  } catch (err) {
    statusEl.textContent = `Failed to fetch: ${err.message}. The site may block cross-origin requests.`;
    statusEl.className = 'status error';
  } finally {
    fetchBtn.disabled = false;
  }
}

fetchBtn.addEventListener('click', handleFetch);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleFetch(); });
</script>

</body>
</html>
