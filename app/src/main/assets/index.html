<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thermal Scan // Hand Viewfinder</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    width: min(96vw, 720px);
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1px #ff8a3355, 0 0 40px #ff2f6e33;
    background: #0a0a10;
  }
  video { display: none; }
  canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .hud {
    position: absolute;
    color: #ffd36f;
    font-size: 11px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #ff8a33aa;
    z-index: 5;
    pointer-events: none;
  }
  #topLeft {
    top: 12px; left: 14px;
    display: flex; align-items: center; gap: 6px;
    font-weight: 700;
  }
  #dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff2f6e;
    box-shadow: 0 0 8px #ff2f6e;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  #topRight {
    top: 12px; right: 14px;
    text-align: right;
    background: rgba(20,8,5,0.45);
    border: 1px solid #ff8a3344;
    padding: 8px 12px;
    border-radius: 6px;
    line-height: 1.5;
  }
  #topRight .title { color: #ff2f6e; font-weight: 700; font-size: 12px; text-shadow: 0 0 6px #ff2f6eaa; }
  #topRight .sub { color: #ffd36f; font-size: 11px; }
  #frameStatus { color: #39ff8a; text-shadow: 0 0 6px #39ff8aaa; }
  #frameStatus.inactive { color: #ff2f6e; text-shadow: 0 0 6px #ff2f6eaa; }
  #bottomBar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    padding: 30px 14px 10px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    z-index: 5;
    font-size: 10px;
    color: #ffd36f;
    letter-spacing: 1px;
  }
  #captureBtn {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 54px; height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8a33, #3a1a0a);
    border: 2px solid #ffd36f;
    box-shadow: 0 0 18px #ff8a3377;
    cursor: pointer;
    z-index: 6;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  #captureBtn:active { transform: translateX(-50%) scale(0.92); }
  #flash {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none; z-index: 8;
  }
  #status {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #ffd36f; text-shadow: 0 0 8px #ff8a33; font-size: 14px;
    z-index: 10; text-align: center; background: rgba(0,0,0,0.5);
  }
  #startBtn {
    padding: 13px 26px; font-size: 14px; letter-spacing: 1px;
    background: linear-gradient(90deg, #ff2f6e, #ff8a33);
    border: none; border-radius: 30px; color: #05050a; font-weight: 700;
    cursor: pointer; box-shadow: 0 0 25px rgba(255,138,51,0.6);
  }
  #perfBadge {
    position: absolute; bottom: 12px; right: 14px;
    font-size: 10px; color: #ffd36f; opacity: 0.6; z-index: 6;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud" id="topLeft"><div id="dot"></div>THERMAL SCAN // ACTIVE</div>
    <div class="hud" id="topRight">
      <div class="title">TEMP NODE / 02</div>
      <div class="sub">HEAT SIGNATURE</div>
      <div class="sub">FRAME: <span id="frameStatus" class="inactive">INACTIVE</span></div>
    </div>
    <div id="bottomBar">● THERMAL SCAN ACTIVE. EFFECT ONLY INSIDE THE BOX.</div>
    <div id="captureBtn" title="Capture">📸</div>
    <div id="flash"></div>
    <div id="perfBadge">FPS: <span id="fps">--</span></div>

    <div id="status"><button id="startBtn">▶ Activate Camera</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const frameStatusEl = document.getElementById('frameStatus');
const captureBtn = document.getElementById('captureBtn');
const flashEl = document.getElementById('flash');
const fpsEl = document.getElementById('fps');
const frameBox = document.getElementById('frame');

let cw = 0, ch = 0;
function resize() {
  const rect = frameBox.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  cw = Math.round(rect.width);
  ch = Math.round(rect.height);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let frames = 0, lastFpsTime = performance.now();
function tickFps() {
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsEl.textContent = frames;
    frames = 0;
    lastFpsTime = now;
  }
}

// ---- precomputed thermal LUT (256 entries) — built once, zero cost per frame ----
// Stops mimic an "iron/rainbow" thermal palette: black -> blue -> magenta -> pink -> orange -> yellow -> cyan-white
const thermalStops = [
  [0,   0,   0,   30],
  [40,  30,  0,   120],
  [90,  120, 0,   200],
  [130, 220, 0,   180],
  [160, 255, 30,  120],
  [190, 255, 120, 40],
  [220, 255, 220, 40],
  [255, 200, 255, 210]
];
const LUT_R = new Uint8ClampedArray(256);
const LUT_G = new Uint8ClampedArray(256);
const LUT_B = new Uint8ClampedArray(256);
(function buildLUT() {
  for (let i = 0; i < thermalStops.length - 1; i++) {
    const [p0, r0, g0, b0] = thermalStops[i];
    const [p1, r1, g1, b1] = thermalStops[i + 1];
    for (let v = p0; v <= p1; v++) {
      const t = (v - p0) / (p1 - p0 || 1);
      LUT_R[v] = r0 + (r1 - r0) * t;
      LUT_G[v] = g0 + (g1 - g0) * t;
      LUT_B[v] = b0 + (b1 - b0) * t;
    }
  }
})();

let scanTick = 0;

// ---- sparkle / lens-flare particles that drift near the tracked frame ----
let sparkles = [];
const MAX_SPARKLES = 26;
function spawnSparkle(x, y) {
  if (sparkles.length >= MAX_SPARKLES) sparkles.shift();
  sparkles.push({
    x, y,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6 - 0.2,
    life: 1,
    r: Math.random() * 2.5 + 1,
    hue: Math.random() * 40 + 30 // warm gold/orange range
  });
}
function updateAndDrawSparkles() {
  ctx.save();
  for (const s of sparkles) {
    s.x += s.vx; s.y += s.vy; s.life -= 0.015;
    if (s.life <= 0) continue;
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = `hsl(${s.hue}, 100%, 75%)`;
    ctx.beginPath();
    // simple 4-point sparkle (cheap: two thin rects instead of star path)
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(s.x - s.r * 2.2, s.y - 0.4, s.r * 4.4, 0.8);
    ctx.fillRect(s.x - 0.4, s.y - s.r * 2.2, 0.8, s.r * 4.4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  sparkles = sparkles.filter(s => s.life > 0);
}

function drawThermalGlitch(rx, ry, rw, rh) {
  if (rw < 4 || rh < 4) return;
  rx = Math.max(0, Math.round(rx));
  ry = Math.max(0, Math.round(ry));
  rw = Math.round(rw);
  rh = Math.round(rh);
  if (rx + rw > cw) rw = cw - rx;
  if (ry + rh > ch) rh = ch - ry;
  if (rw < 4 || rh < 4) return;

  let imgData;
  try {
    imgData = ctx.getImageData(rx, ry, rw, rh);
  } catch (e) { return; }
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const lum = (d[i] * 0.34 + d[i + 1] * 0.5 + d[i + 2] * 0.16) | 0;
    d[i]     = LUT_R[lum];
    d[i + 1] = LUT_G[lum];
    d[i + 2] = LUT_B[lum];
  }
  ctx.putImageData(imgData, rx, ry);

  ctx.save();
  ctx.beginPath();
  ctx.rect(rx, ry, rw, rh);
  ctx.clip();

  // faint scanlines
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#fff2c9';
  for (let y = ry; y < ry + rh; y += 3) ctx.fillRect(rx, y, rw, 1);
  ctx.globalAlpha = 1;

  // occasional horizontal slice glitch with slight RGB split for chromatic feel
  scanTick++;
  if (scanTick % 6 === 0) {
    const sliceY = ry + Math.random() * rh;
    const sliceH = 4 + Math.random() * 10;
    const off = (Math.random() - 0.5) * 8;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(canvas, rx, sliceY, rw, sliceH, rx + off, sliceY, rw, sliceH);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // viewfinder corner brackets
  ctx.strokeStyle = '#ffd36f';
  ctx.lineWidth = 2;
  const L = Math.min(20, rw * 0.2, rh * 0.2);
  const corners = [
    [rx, ry, 1, 1], [rx + rw, ry, -1, 1],
    [rx, ry + rh, 1, -1], [rx + rw, ry + rh, -1, -1]
  ];
  for (const [x, y, dx, dy] of corners) {
    ctx.beginPath();
    ctx.moveTo(x, y + L * dy);
    ctx.lineTo(x, y);
    ctx.lineTo(x + L * dx, y);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,211,111,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(rx, ry, rw, rh);
  ctx.setLineDash([]);
}

function onResults(results) {
  ctx.clearRect(0, 0, cw, ch);

  ctx.save();
  ctx.scale(-1, 1);
  ctx.translate(-cw, 0);
  ctx.drawImage(results.image, 0, 0, cw, ch);
  ctx.restore();

  const hands = results.multiHandLandmarks || [];
  let corner1 = null, corner2 = null;

  if (hands.length >= 2) {
    const p1 = hands[0][8];
    const p2 = hands[1][8];
    corner1 = { x: (1 - p1.x) * cw, y: p1.y * ch };
    corner2 = { x: (1 - p2.x) * cw, y: p2.y * ch };
  } else if (hands.length === 1) {
    const thumb = hands[0][4];
    const index = hands[0][8];
    corner1 = { x: (1 - thumb.x) * cw, y: thumb.y * ch };
    corner2 = { x: (1 - index.x) * cw, y: index.y * ch };
  }

  if (corner1 && corner2) {
    frameStatusEl.textContent = 'ACTIVE';
    frameStatusEl.classList.remove('inactive');
    const rx = Math.min(corner1.x, corner2.x);
    const ry = Math.min(corner1.y, corner2.y);
    const rw = Math.abs(corner2.x - corner1.x);
    const rh = Math.abs(corner2.y - corner1.y);
    drawThermalGlitch(rx, ry, rw, rh);

    if (Math.random() < 0.5) spawnSparkle(corner1.x, corner1.y);
    if (Math.random() < 0.5) spawnSparkle(corner2.x, corner2.y);
    if (Math.random() < 0.3) spawnSparkle(rx + Math.random() * rw, ry + Math.random() * rh);
  } else {
    frameStatusEl.textContent = 'INACTIVE';
    frameStatusEl.classList.add('inactive');
  }

  updateAndDrawSparkles();
  tickFps();
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

let camera = null;
let sending = false;

startBtn.addEventListener('click', async () => {
  statusEl.innerHTML = 'Starting camera…';
  try {
    camera = new Camera(video, {
      onFrame: async () => {
        if (sending) return;
        sending = true;
        await hands.send({ image: video });
        sending = false;
      },
      width: 640,
      height: 480
    });
    await camera.start();
    statusEl.style.display = 'none';
  } catch (err) {
    statusEl.innerHTML = 'Camera access denied or unavailable.<br>Please allow camera permissions and reload.';
    console.error(err);
  }
});

captureBtn.addEventListener('click', () => {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.85';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.4s ease';
    flashEl.style.opacity = '0';
  });
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `thermal-frame-${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
});
</script>
</body>
</html>
