<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KeyPop ASMR - Interactive Mini Keyboard</title><style>:root{--bg-color:#0f1115;--panel-bg:rgba(22, 26, 33, 0.85);--text-color:#e0e6ed;--accent-color:#6366f1;--accent-glow:rgba(99, 102, 241, 0.4);--board-bg:#e2e8f0;--board-shadow:#000000;--key-bg:#ffffff;--key-border:#cbd5e1;--key-shadow:#94a3b8;--switch-bg:rgba(51, 65, 85, 0.6)}body.asmr-mode{--bg-color:#050608;--panel-bg:rgba(12, 14, 18, 0.9);--accent-color:#10b981;--accent-glow:rgba(16, 185, 129, 0.3);--board-bg:#cbd5e1;--key-bg:#f1f5f9}*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;touch-action:manipulation}body{background-color:var(--bg-color);color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow-x:hidden;transition:background-color .5s ease;padding:15px}#start-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,12,16,.95);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;cursor:pointer;transition:opacity .4s ease,visibility .4s}#start-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.start-btn{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;padding:18px 36px;font-size:1.2rem;font-weight:700;border-radius:50px;box-shadow:0 10px 25px rgba(79,70,229,.4);border:none;cursor:pointer;animation:pulse 2s infinite}@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(99,102,241,.7)}70%{transform:scale(1.03);box-shadow:0 0 0 15px rgba(99,102,241,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(99,102,241,0)}}.app-container{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:20px;margin:auto}header{text-align:center;margin-bottom:5px}header h1{font-size:2rem;letter-spacing:2px;background:linear-gradient(135deg,#fff,var(--text-color));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.keyboard-wrapper{perspective:1000px;padding:20px 10px;width:100%;display:flex;justify-content:center}.keyboard-base{background:var(--board-bg);padding:24px;border-radius:28px;display:flex;gap:16px;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.8),inset 0 -6px 12px rgba(0,0,0,.15);transform:rotateX(18deg) rotateY(0);transform-style:preserve-3d;transition:transform .1s ease,background .3s;position:relative}.key-slot{position:relative;width:75px;height:90px;background:#1e293b;border-radius:16px;box-shadow:inset 0 5px 10px rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center}.switch-housing{position:absolute;width:48px;height:48px;background:var(--switch-bg);border-radius:8px;border:1px solid rgba(255,255,255,.1);top:20px;box-shadow:inset 0 0 6px rgba(0,0,0,.5)}.switch-stem{position:absolute;width:16px;height:16px;background:var(--accent-color);top:16px;left:16px;border-radius:3px;box-shadow:0 0 8px var(--accent-glow)}.keycap{position:absolute;top:-12px;width:75px;height:85px;background:linear-gradient(180deg,#fff 0,var(--key-bg) 100%);border-radius:16px;box-shadow:0 12px 0 var(--key-shadow),0 15px 20px rgba(0,0,0,.4),inset 0 2px 3px #fff,inset 0 -2px 4px rgba(0,0,0,.1);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 0;transition:transform 50ms ease,box-shadow 50ms ease,filter .1s ease;transform:translateY(0);z-index:2;border:1px solid var(--key-border)}.keycap::before{content:'';position:absolute;top:6px;width:55px;height:40px;background:rgba(255,255,255,.4);border-radius:10px 10px 6px 6px;pointer-events:none}.keycap .key-label{font-size:1.2rem;font-weight:800;color:#334155;z-index:3;margin-top:4px}.keycap .key-sub{font-size:.65rem;font-weight:700;color:#94a3b8;z-index:3;text-transform:uppercase}.keycap.pressed{transform:translateY(10px);box-shadow:0 2px 0 var(--key-shadow),0 4px 8px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.8);filter:brightness(.96)}.panel{background:var(--panel-bg);border-radius:20px;padding:20px;width:100%;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.panel-section{display:flex;flex-direction:column;gap:12px}.panel-title{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:6px}.mode-toggles{display:flex;gap:10px}.btn-mode{flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--text-color);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;font-size:.85rem}.btn-mode.active{background:var(--accent-color);border-color:var(--accent-color);color:#fff;box-shadow:0 4px 12px var(--accent-glow)}.control-group{display:flex;flex-direction:column;gap:6px}.control-label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd5e1}input[type=range]{-webkit-appearance:none;width:100%;background:rgba(255,255,255,.1);height:6px;border-radius:3px;outline:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent-color);cursor:pointer}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn-profile{padding:8px;font-size:.75rem;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2);color:#cbd5e1;cursor:pointer;text-align:center;transition:all .2s}.btn-profile.active{background:rgba(255,255,255,.15);border-color:var(--accent-color);color:#fff;font-weight:700}.sound-test-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.btn-test{padding:6px 4px;font-size:.7rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:#94a3b8;border-radius:6px;cursor:pointer;text-align:center;transition:all .15s}.btn-test:hover{background:rgba(255,255,255,.1);color:#fff}.btn-test:active{transform:scale(.95)}.stats-container{display:flex;justify-content:space-around;background:rgba(0,0,0,.3);border-radius:12px;padding:12px;margin-top:5px}.stat-box{text-align:center}.stat-value{font-size:1.2rem;font-weight:800;color:var(--accent-color);font-family:monospace}.stat-label{font-size:.65rem;color:#64748b;text-transform:uppercase}@media (max-width:600px){.keyboard-base{gap:8px;padding:16px;transform:rotateX(10deg)}.key-slot,.keycap{width:65px}.keycap{height:80px}.panel{grid-template-columns:1fr}.sound-test-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="start-overlay"><button class="start-btn" id="start-btn">🎧 TAP TO START ASMR</button></div><div class="app-container"><header><h1>KEYPOP ASMR</h1></header><div class="keyboard-wrapper"><div class="keyboard-base" id="keyboard"><div class="key-slot"><div class="switch-housing"><div class="switch-stem"></div></div><div class="keycap" data-key="a" id="key-0"><span class="key-label">A</span> <span class="key-sub">POP</span></div></div><div class="key-slot"><div class="switch-housing"><div class="switch-stem"></div></div><div class="keycap" data-key="s" id="key-1"><span class="key-label">S</span> <span class="key-sub">CLACK</span></div></div><div class="key-slot"><div class="switch-housing"><div class="switch-stem"></div></div><div class="keycap" data-key="d" id="key-2"><span class="key-label">D</span> <span class="key-sub">THOCK</span></div></div><div class="key-slot"><div class="switch-housing"><div class="switch-stem"></div></div><div class="keycap" data-key="f" id="key-3"><span class="key-label">F</span> <span class="key-sub">SNAP</span></div></div></div></div><div class="panel"><div class="panel-section"><d
